[project]
name = "badscan"
version = "0.1.0"
description = "Scan repositories for bad patterns common in unverified generated code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pyyaml>=6",
  "pathspec>=0.12",
  "httpx>=0.27",
  "pydantic-ai>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
badscan = "badscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["badscan"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "badscan/rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["badscan", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["badscan"]
