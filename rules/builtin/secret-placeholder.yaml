id: secret.placeholder
status: confirmed
severity: high
confidence: 0.9
category: placeholder-secret
languages: ["*"]
message: Placeholder secret is still assigned in this file.
detect:
  type: regex
  regex: |-
    (?i)(YOUR_API_KEY|sk-x{4,}|api[_-]?key\s*=\s*['"](?:changeme|your_api_key|replace_me|x{3,})['"]|password\s*=\s*['"](?:password|changeme|secret)['"])
examples:
  match: 'api_key = "changeme"'
  reject: 'api_key = os.environ["API_KEY"]'
